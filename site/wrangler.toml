# Serves the built site from the edge. There is no main, so no script ever runs
# and no visitor request is billed or counted against the request limit.
name = "hypergesture-site"
compatibility_date = "2026-10-22"

# Off. On, the same Worker would also answer on workers.dev.
workers_dev = false

[assets]
directory = "./dist"

# Answers an unknown path with dist/404.html and a 404 status.
not_found_handling = "404-page"

# A custom domain creates the DNS record and certificate itself. A route would need
# a proxied record already in place, and this hostname has none.
[[routes]]
pattern = "hypergesture.h3nc4.com"
zone_name = "h3nc4.com"
custom_domain = true
