<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="../../src/styles/site.css" />
    <style>
      @font-face{font-family:"Geist";font-style:normal;font-weight:100 900;src:url(../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format("woff2")}
      html,body{width:1200px;height:630px;overflow:hidden}
      body{display:grid;grid-template-columns:1fr 248px;gap:96px;align-items:center;padding:60px 108px 60px 96px}
      .brand{display:flex;align-items:center;gap:14px;font-size:36px;font-weight:650;letter-spacing:-.02em}
      .brand svg{width:40px;height:40px}
      h1{margin-top:36px;font-size:88px;line-height:1;letter-spacing:-.04em;max-width:11ch}
      p{margin-top:32px;font-size:36px;line-height:1.25;color:var(--muted);max-width:24ch}
      .phone{width:248px;height:auto;display:block;filter:drop-shadow(0 18px 28px rgb(15 40 28 / .18))}
    </style>
  </head>
  <body>
    <div>
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="1.5" width="16" height="21" rx="4" fill="none" stroke="currentColor" stroke-width="2"></rect><path d="M8 18.5h8" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"></path><path d="M4.5 9v6" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"></path></svg>
        HyperGesture
      </div>
      <h1>{{headline}}</h1>
      <p>{{line}}</p>
    </div>
    <svg class="phone" viewBox="0 0 200 400" aria-hidden="true">
      <defs><clipPath id="scr"><rect x="10" y="10" width="180" height="380" rx="23"></rect></clipPath></defs>
      <rect x="2" y="2" width="196" height="396" rx="31" fill="var(--phone)" stroke="var(--line)" stroke-width="1.5"></rect>
      <g clip-path="url(#scr)">
        <rect x="10" y="10" width="180" height="380" fill="var(--app-a)"></rect>
        <rect x="10" y="10" width="180" height="70" fill="var(--app-a-head)"></rect>
        <rect x="24" y="96" width="152" height="110" rx="12" fill="var(--block)"></rect>
        <g fill="var(--block)"><rect x="24" y="220" width="140" height="12" rx="6"></rect><rect x="24" y="242" width="150" height="12" rx="6"></rect><rect x="24" y="264" width="90" height="12" rx="6"></rect></g>
        <rect x="70" y="378" width="60" height="4" rx="2" fill="var(--ink)" opacity=".55"></rect>
        <path d="M10 140 C10 172 42 178 42 200 C42 222 10 228 10 260 Z" fill="var(--bulge)" opacity=".86"></path>
        <path d="M30 191 L22 200 L30 209" fill="none" stroke="var(--arrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="58" cy="200" r="11" fill="var(--dot)" fill-opacity=".55" stroke="var(--dot)" stroke-width="2.5"></circle>
      </g>
      <circle cx="100" cy="24" r="4" fill="var(--phone)"></circle>
    </svg>
  </body>
</html>
