name: Resolve dev container image
description: >
  Wraps resolve.sh beside it, which names the image this run should use, builds it when
  a change touches the image inputs, and exports the docker invocation the suite's steps
  need. The logic lives in the script so that shellcheck covers it.

inputs:
  published-repo:
    description: Repository of the published image, without a tag.
    required: true
  cache-from:
    description: >
      Passed straight to buildx --cache-from, for example type=gha. Empty, the default,
      builds without a cache: worth keeping for an image that squashes to one large layer,
      where the entry would crowd out everything else in a small cache budget.
    required: false
    default: ""
  cache-to:
    description: Passed straight to buildx --cache-to, for example type=gha,mode=max.
    required: false
    default: ""
  docker-args:
    description: >
      Extra flags for the exported invocation, appended after the defaults so they win:
      a later -w or --user overrides the earlier one, and mounts simply add. This is how a
      caller supplies what the action has no business assuming, such as where a build
      tool keeps its cache.
    required: false
    default: ""

outputs:
  image:
    description: Image reference to run the suite in.
    value: ${{ steps.resolve.outputs.image }}

runs:
  using: composite
  steps:
    # Only a cache needs buildx: the default builder cannot export one.
    - if: inputs.cache-from != '' || inputs.cache-to != ''
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    - id: resolve
      shell: sh
      run: "${{ github.action_path }}/resolve.sh"
      env:
        PUBLISHED_REPO: ${{ inputs.published-repo }}
        # Null on whichever event does not carry it; the script reads that as no base.
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        CACHE_FROM: ${{ inputs.cache-from }}
        CACHE_TO: ${{ inputs.cache-to }}
        DOCKER_ARGS: ${{ inputs.docker-args }}
