name: HyperGesture Development CI

on:
  push:
    branches:
      - "main"
      - "release/*"
  pull_request:
    branches:
      - "main"
      - "release/*"

env:
  DEV_DOCKER_ARGS: -e GRADLE_USER_HOME=/workspace/.gradle-ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Run actions/dev-image
        uses: ./.github/actions/dev-image
        with:
          published-repo: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}-dev
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .gradle-ci/caches
          key:
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'app/build.gradle.kts',
            'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Lint shell scripts
        run: $DEV_RUN -c 'shellcheck -o all scripts/*.sh scripts/hooks/* .github/actions/*/*.sh'
      - name: Android lint, unit tests, coverage and debug APK
        run: $DEV_RUN -c 'gradle --no-daemon lint test jacocoTestReport assembleDebug'
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            app/build/reports/jacoco/
            app/build/reports/tests/
          retention-days: 1

  sonarqube:
    name: SonarQube Scan
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch history for SonarQube
      - name: Run actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage
          path: app/build/reports
      - name: Fail if the coverage report did not land
        run: test -s app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
      - name: Run SonarQube analysis
        run: ./scripts/sonar.sh
