name: HyperGesture Development CI

on:
  push:
    branches:
      - "main"
      - "release/*"
  pull_request:
    branches:
      - "main"
      - "release/*"
  schedule:
    - cron: "30 6 * * *" # Daily at 06:30 UTC
  workflow_dispatch:

env:
  DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/gradle:/cache/gradle -e GRADLE_USER_HOME=/cache/gradle

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request run is superseded by the pin push that lands seconds into it, so only one
  # full run is paid for. A push to the default branch still queues, since it deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@1e296b26a16b3e20db153e32b963d953a41ef1a1 # v2
        with:
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Run actions/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/ci-cache/gradle
          key:
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'app/build.gradle.kts',
            'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Create the cache directories
        run: mkdir -p ~/ci-cache/gradle
      - name: Lint shell scripts
        run: $DEV_RUN -c 'shellcheck -o all -x e2e/*.sh scripts/*.sh scripts/hooks/*'
      - name: Android lint, unit tests, coverage and debug APK
        run: $DEV_RUN -c 'gradle --no-daemon lint test jacocoTestReport assembleDebug'
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            app/build/reports/jacoco/
            app/build/reports/tests/
          retention-days: 1

  sonarqube:
    name: SonarQube Scan
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch history for SonarQube
      - name: Run actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage
          path: app/build/reports
      - name: Fail if the coverage report did not land
        run: test -s app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
      - name: Name the image the scan comes from
        run: |
          image="$(sed -n 's|^FROM \(h3nc4/dev-base:[^ ]*\) AS main|\1|p' docker/dev.Dockerfile)"
          case "${image}" in
            h3nc4/dev-base:*@sha256:*) ;;
            *) echo "::error::docker/dev.Dockerfile names no pinned dev-base to take the scan from"; exit 1 ;;
          esac
          echo "SCAN_IMAGE=${image}" >>"${GITHUB_ENV}"
      - name: Run h3nc4/sonar-action
        uses: h3nc4/sonar-action@e799384ff5832f1bc2205946e6f342029c3b388c # v1
        with:
          host-url: ${{ vars.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
          image: ${{ env.SCAN_IMAGE }}
          script: /usr/local/bin/sonar
