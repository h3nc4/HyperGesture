name: HyperGesture Development CI

on:
  push:
    branches:
      - "main"
      - "release/*"
  pull_request:
    branches:
      - "main"
      - "release/*"
  schedule:
    - cron: "30 6 * * *" # Daily at 06:30 UTC
  workflow_dispatch:

env:
  DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/gradle:/cache/gradle -e GRADLE_USER_HOME=/cache/gradle

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request run is superseded by the pin push that lands seconds into it, so only one
  # full run is paid for. A push to the default branch still queues, since it deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Look for a change outside the site and the prose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: List the pull request's files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          code=true
          if [ "${EVENT}" = pull_request ]; then
            files="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[].filename')"
            if [ -n "${files}" ]; then
              code=false
              while IFS= read -r path; do
                case "${path}" in
                  site/* | *.md | LICENSE | .github/workflows/site.yaml) ;;
                  *) code=true ;;
                esac
              done <<<"${files}"
            fi
          fi
          echo "code: ${code}"
          echo "code=${code}" >>"${GITHUB_OUTPUT}"

  verification-metadata:
    name: Regenerate Gradle verification metadata
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: "4811373"
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Run actions/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/ci-cache/gradle
          key:
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'app/build.gradle.kts',
            'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Create the cache directories
        run: mkdir -p ~/ci-cache/gradle
      - name: Write the verification metadata
        run: >-
          $DEV_RUN -c 'gradle --no-daemon --write-verification-metadata sha256
          lint test jacocoTestReport assembleDebug assembleRelease'
      - name: Push the metadata to the pull request's branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm 'regenerate gradle verification metadata' -- gradle/verification-metadata.xml
          git push --quiet origin "HEAD:${HEAD_REF}"
          echo '::error::pushed regenerated verification metadata, the run on the new head checks it'
          exit 1

  checks:
    name: Lint, test and build
    needs: [changes, verification-metadata]
    if: >-
      !cancelled() && needs.verification-metadata.result != 'failure' &&
      needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Run actions/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/ci-cache/gradle
          key:
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'app/build.gradle.kts',
            'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Create the cache directories
        run: mkdir -p ~/ci-cache/gradle
      - name: Lint shell scripts
        run: $DEV_RUN -c 'shellcheck -o all -x e2e/lib e2e/*.sh scripts/*.sh scripts/hooks/*'
      - name: Android lint, unit tests, coverage, debug APK and minified release APK
        run: >-
          $DEV_RUN -c 'gradle --no-daemon --dependency-verification=strict
          lint test jacocoTestReport assembleDebug assembleRelease'
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            app/build/reports/jacoco/
            app/build/reports/tests/
          retention-days: 1

  sonarqube:
    name: SonarQube Scan
    needs: [checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch history for SonarQube
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage
          path: app/build/reports
      - name: Fail if the coverage report did not land
        run: test -s app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
      - name: Name the image the scan comes from
        run: |
          image="$(sed -n 's|^FROM \(h3nc4/dev-base:[^ ]*\) AS main|\1|p' docker/dev.Dockerfile)"
          case "${image}" in
            h3nc4/dev-base:*@sha256:*) ;;
            *) echo "::error::docker/dev.Dockerfile names no pinned dev-base to take the scan from"; exit 1 ;;
          esac
          echo "SCAN_IMAGE=${image}" >>"${GITHUB_ENV}"
      - name: Run h3nc4/sonar-action
        uses: h3nc4/sonar-action@c10bc623edc7c789ba88837fa9d330e4341d9f72 # v1
        with:
          host-url: ${{ vars.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
          image: ${{ env.SCAN_IMAGE }}
          script: /usr/local/bin/sonar
