name: HyperGesture Gesture E2E

# Drives a real emulator, which is the only way to catch integration bugs the JVM tests
# cannot reach. Needs KVM, so it runs separately from the main CI.

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release/*"
  pull_request:
    branches:
      - "main"
      - "release/*"

env:
  DEV_DOCKER_ARGS: -v ${HOME:?}/ci-cache/gradle:/cache/gradle -e GRADLE_USER_HOME=/cache/gradle --device /dev/kvm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gestures:
    name: Gesture end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # dev-image diffs against the base to spot image changes
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@896daea2e2bdda063d6992243c634f156ce057ac # v1
        with:
          published-repo: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}-dev
          docker-args: ${{ env.DEV_DOCKER_ARGS }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run actions/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/ci-cache
          key:
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'app/build.gradle.kts',
            'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Create the cache directories
        run: mkdir -p ~/ci-cache/gradle
      - name: Build the debug APK
        run: $DEV_RUN -c 'gradle --no-daemon assembleDebug'
      - name: Run the gesture E2E suite
        run: $DEV_RUN -c './scripts/e2e-gestures.sh'
      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: emulator-log
          path: build/e2e-logs/
          retention-days: 3
