name: Sync deps with main

on:
  push:
    branches:
      - "main"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into deps
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Request an app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: "4811373"
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Merge main into deps
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/deps" --silent 2>/dev/null; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/heads/deps -f "sha=${GITHUB_SHA}" --silent
            echo "::notice::created deps at ${GITHUB_SHA}"
            exit 0
          fi
          if ! merged="$(gh api "repos/${GITHUB_REPOSITORY}/merges" -f base=deps \
            -f "head=${GITHUB_SHA}" -f "commit_message=merge main into deps" --jq '.sha // empty' 2>&1)"; then
            printf '%s\n' "${merged}"
            echo "::error::${GITHUB_SHA} does not merge into deps cleanly, so deps is left as it was." \
              "Merge main into deps by hand, then run deps-promote again."
            exit 1
          fi
          if [[ -n "${merged}" ]]; then
            echo "::notice::merged ${GITHUB_SHA} into deps as ${merged}"
          else
            echo "::notice::deps already contains ${GITHUB_SHA}"
          fi
      - name: Refresh an open promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open="$(gh pr list -R "${GITHUB_REPOSITORY}" --head deps-promote --base main --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "${open}" ]]; then
            gh workflow run deps-promote.yaml -R "${GITHUB_REPOSITORY}" --ref main
            echo "::notice::main moved under #${open}, so deps-promote rebuilds it"
          fi
