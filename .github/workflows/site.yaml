name: HyperGesture Site

on:
  push:
    branches:
      - "main"
    paths:
      - "site/**"
      - ".github/workflows/site.yaml"
  pull_request:
    branches:
      - "main"
    paths:
      - "site/**"
      - ".github/workflows/site.yaml"
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      apk-size:
        type: string
        required: true
      cert-sha256:
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-latest
    container: node:26.13.0-slim@sha256:e4db4c914bf8ad241bd24804fc25d272d89bad97e68cdc8a1414862790a02c39
    defaults:
      run:
        working-directory: site
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Name the release the site describes
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_APK_SIZE: ${{ inputs.apk-size }}
          IN_CERT_SHA256: ${{ inputs.cert-sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-facts.mjs >>"${GITHUB_ENV}"
      - name: Install dependencies
        run: npm ci
      - name: Build the site
        run: npm run build
      - name: Check page weight and internal links
        run: npm run check
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: site/dist/
          retention-days: 1

  deploy:
    name: Deploy the site to Cloudflare Workers
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || inputs.version != '')
    runs-on: ubuntu-latest
    concurrency:
      group: hypergesture-site-deploy
      cancel-in-progress: false
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: site/dist
      - name: Run cloudflare/wrangler-action
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.156.0"
          workingDirectory: site
          command: deploy
