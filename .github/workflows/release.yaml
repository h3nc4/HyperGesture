name: HyperGesture Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  check-tag-branch:
    name: Check Tag Location
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tag is on main branch
        run: git merge-base --is-ancestor ${{ github.sha }} origin/main

  prepare:
    name: Prepare environment
    runs-on: ubuntu-latest
    needs: check-tag-branch
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.read_tag.outputs.tag }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >>"${GITHUB_OUTPUT}"
      - id: read_tag
        run: echo "tag=$(cat .github/VERSION)" >>"${GITHUB_OUTPUT}"

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # Authenticated pulls of the dev image, which anonymous rate limits can refuse.
      - name: Run docker/login-action
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode >android.keystore
      # assembleRelease falls back to an unsigned APK when either piece is missing, so
      # absent signing material has to fail here rather than ship an uninstallable build.
      - name: Verify signing material is present
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -s android.keystore || {
            echo '::error::ANDROID_KEYSTORE_B64 is empty or not valid base64' && exit 1
          }
          test -n "${KEYSTORE_PASSWORD}" || {
            echo '::error::KEYSTORE_PASSWORD is unset' && exit 1
          }
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./scripts/build-apk.sh "${{ needs.prepare.outputs.version }}"
      - name: Verify the APK is signed
        run: |
          docker run --rm --entrypoint bash \
            -v "${PWD}:/apk:ro" \
            "${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}-dev:${{ needs.prepare.outputs.tag }}" \
            -c 'set -e
              apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -n1)"
              "${apksigner}" verify --print-certs /apk/hypergesture.apk'
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk
          path: hypergesture.apk
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
    steps:
      - name: Run actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apk
      - name: Run softprops/action-gh-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: hypergesture.apk

  bump-version-code:
    name: Bump versionCode for the next release
    runs-on: ubuntu-latest
    needs: [prepare, release]
    permissions:
      contents: write
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      # Android refuses to install an APK whose versionCode went backwards, so the
      # released code is burned and main moves on to the next one.
      - name: Run scripts/bump-version.sh
        run: ./scripts/bump-version.sh
      - name: Commit and push
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "Bump versionCode after v${{ needs.prepare.outputs.version }} [skip ci]"
          repo: ${{ github.repository }}
          branch: main
          file_pattern: "app/build.gradle.kts"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
