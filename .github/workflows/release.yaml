name: HyperGesture Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag-branch:
    name: Check Tag Location
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify tag is on main branch
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  prepare:
    name: Prepare environment
    runs-on: ubuntu-latest
    needs: check-tag-branch
    outputs:
      version: ${{ steps.version.outputs.version }}
      dev-image: ${{ steps.dev_image.outputs.ref }}
      dev-image-tag: ${{ steps.dev_image.outputs.tag }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check the tag is vMAJOR.MINOR.PATCH
        id: version
        run: |
          version="$(./scripts/check-release.sh tag "${GITHUB_REF_NAME}")"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - name: Check versionCode is above the previous release
        run: ./scripts/check-release.sh version-code "${GITHUB_REF_NAME}"
      - name: Pin the dev image by digest
        id: dev_image
        run: |
          ref="$(./scripts/devcontainer-image.sh)"
          digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          case "${digest}" in
            sha256:*) ;;
            *) echo "::error::${ref} resolved to no digest" && exit 1 ;;
          esac
          echo "ref=${ref}@${digest}" >>"${GITHUB_OUTPUT}"
          echo "tag=${ref##*:}@${digest}" >>"${GITHUB_OUTPUT}"

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      apk-size: ${{ steps.verify.outputs.apk-size }}
      cert-sha256: ${{ steps.verify.outputs.cert-sha256 }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run docker/setup-buildx-action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 --decode >android.keystore
      - name: Verify signing material is present
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -s android.keystore || {
            echo '::error::ANDROID_KEYSTORE_B64 is empty or not valid base64' && exit 1
          }
          test -n "${KEYSTORE_PASSWORD}" || {
            echo '::error::KEYSTORE_PASSWORD is unset' && exit 1
          }
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DEV_IMAGE_TAG: ${{ needs.prepare.outputs.dev-image-tag }}
        run: ./scripts/build-apk.sh "${VERSION}"
      - name: Verify the APK is signed with the pinned certificate
        id: verify
        env:
          DEV_IMAGE: ${{ needs.prepare.outputs.dev-image }}
        run: |
          docker run --rm --entrypoint bash \
            -v "${PWD}:/apk:ro" \
            "${DEV_IMAGE}" \
            -c 'set -e
              apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -n1)"
              "${apksigner}" verify --print-certs /apk/hypergesture.apk' >"${RUNNER_TEMP}/certs.txt"
          cat "${RUNNER_TEMP}/certs.txt"
          sha="$(./scripts/check-release.sh cert "${RUNNER_TEMP}/certs.txt")"
          echo "cert-sha256=${sha}" >>"${GITHUB_OUTPUT}"
          echo "apk-size=$(stat -c %s hypergesture.apk)" >>"${GITHUB_OUTPUT}"
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk
          path: hypergesture.apk
          retention-days: 1

  e2e:
    name: Gesture suites on the signed release APK
    runs-on: ubuntu-latest
    needs: [prepare, build-apk]
    timeout-minutes: 60
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run docker/login-action
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@f7c620dd589b7ee84c3dcadce0334b43a5ac1ac3 # v3
        with:
          image: ${{ needs.prepare.outputs.dev-image }}
          base-sha: ""
          docker-args: --device /dev/kvm
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run every gesture E2E suite against the APK about to be published
        run: $DEV_RUN -c './e2e/run.sh -p hypergesture.apk'
      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: emulator-log-release
          path: build/e2e-logs/
          retention-days: 3

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-apk, e2e]
    permissions:
      contents: write
    steps:
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apk
      - name: Run softprops/action-gh-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: hypergesture.apk

  site:
    name: Deploy the site for this release
    needs: [prepare, build-apk, release]
    uses: ./.github/workflows/site.yaml
    with:
      version: ${{ needs.prepare.outputs.version }}
      apk-size: ${{ needs.build-apk.outputs.apk-size }}
      cert-sha256: ${{ needs.build-apk.outputs.cert-sha256 }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  bump-version-code:
    name: Bump versionCode for the next release
    runs-on: ubuntu-latest
    needs: [prepare, release]
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BRANCH: bump-versioncode-after-v${{ needs.prepare.outputs.version }}
      TITLE: bump versioncode after v${{ needs.prepare.outputs.version }}
    steps:
      - name: Mint an app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: "4811373"
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      # Android refuses to install an APK whose versionCode went backwards, so the
      # released code is burned and main moves on to the next one.
      - name: Run scripts/bump-version.sh
        run: ./scripts/bump-version.sh
      - name: Create the bump branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${BRANCH}" -f "sha=$(git rev-parse HEAD)"
      - name: Run planetscale/ghcommit-action
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: ${{ env.TITLE }}
          repo: ${{ github.repository }}
          branch: ${{ env.BRANCH }}
          file_pattern: "app/build.gradle.kts"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Open the bump pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          body="Raises versionCode past the one v${VERSION} was built with, so Android installs the next release over it."
          number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f "title=${TITLE}" -f "head=${BRANCH}" -f base=main -f "body=${body}" --jq .number)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/labels" -f "labels[]=automerge"
