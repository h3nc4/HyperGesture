name: Security Analysis

on:
  push:
    branches:
      - "main"
      - "release/*"
  pull_request:
    branches:
      - "main"
      - "release/*"
  schedule:
    - cron: "23 3 * * *" # Daily at 03:23 UTC

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run h3nc4/dev-image-action
        uses: h3nc4/dev-image-action@24e5d67fa210ea49d6ef24c07d7f8f536fe1bb7b # v3
        with:
          workdir: ${{ github.workspace }}
          docker-args: >-
            -v ${RUNNER_TEMP:?}:${RUNNER_TEMP:?} -v ${RUNNER_TOOL_CACHE:?}:${RUNNER_TOOL_CACHE:?}:ro
            --env-file ${RUNNER_TEMP:?}/codeql-tracer.env
      - name: Run github/codeql-action/init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Hand the CodeQL tracer to the dev image
        run: env | sed -n 's/^\(CODEQL_[^=]*\|SEMMLE_[^=]*\|LD_PRELOAD\)=.*/\1/p' >"${RUNNER_TEMP}/codeql-tracer.env"
      - name: Build the debug APK and its unit tests
        run: $DEV_RUN -c 'gradle --no-daemon assembleDebug compileDebugUnitTestKotlin'
      - name: Run github/codeql-action/analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:java-kotlin"
